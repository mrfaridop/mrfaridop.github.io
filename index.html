<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Page</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        #user-info { display: none; margin-top: 20px; }
        #user-pic { border-radius: 50%; width: 80px; height: 80px; margin-top: 10px; }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            background: #d93025;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>स्वागत है</h2>
        
        <!-- Google Sign-In Button -->
        <div id="g_id_onload"
             data-client_id="YOUR_CLIENT_ID_HERE"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large"></div>

        <!-- Logged-in User Profile -->
        <div id="user-info">
            <h3 id="user-name"></h3>
            <p id="user-email"></p>
            <img id="user-pic" src="" alt="Profile">
            <br>
            <button onclick="logout()">लॉगआउट</button>
        </div>
    </div>

    <script>
        function decodeJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const user = decodeJwt(response.credential);
            document.querySelector('.g_id_signin').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('user-name').innerText = user.name;
            document.getElementById('user-email').innerText = user.email;
            document.getElementById('user-pic').src = user.picture;
        }

        function logout() {
            document.querySelector('.g_id_signin').style.display = 'block';
            document.getElementById('user-info').style.display = 'none';
        }
    </script>
</body>
</html>
